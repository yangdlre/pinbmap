<style>
*{box-sizing:border-box}

#mapFloatTools{position:absolute;right:10px;top:10px;z-index:45;display:flex;gap:5px;background:#fffE;padding:5px;border-radius:12px;box-shadow:0 2px 10px #0002}

#hint{position:absolute;z-index:25;left:10px;bottom:12px;right:10px;background:#fffE;padding:7px 9px;border-radius:9px;font-size:11px;box-shadow:0 2px 8px #0002;pointer-events:none}
.wrap{position:absolute;width:0;height:0;overflow:visible}
.pin{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 8px #0005;z-index:5}
.arm{position:absolute;left:0;top:-1px;height:2px;background:#222;transform-origin:0 50%;z-index:2;pointer-events:none}
.card{position:absolute;width:164px;min-height:66px;background:#fff;border:1px solid #d6d9de;border-radius:12px;padding:8px 10px;box-shadow:0 3px 12px #0003;z-index:4;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}

#sourceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}

.sourceBtn.main small{color:#ccd}
#qOpt{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:#555}
#qOpt button{padding:5px 9px;font-size:11px;border-radius:9px}
#qOpt button.on{background:#111;color:#fff;border-color:#111}
#sourceInfo{margin-top:8px;padding:9px 10px;background:#f7f8fa;border-radius:11px;font-size:11px;line-height:1.55;color:#4d535c}
#sourceInfo b{color:#111}
#mapTools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}

#extTools button{padding:9px 4px;font-size:12px;border-radius:10px}

<body class="mode-food">
<div id="app">
<header>
  <div class="row">
    <select id="mode"><option value="food" selected>🍽 맛집</option><option value="tour">🏝 관광지</option><option value="fuel">⛽ 주유·충전</option></select>

      <option value="흑돼지">흑돼지</option><option value="고기국수">고기국수</option><option value="해물">해물·갈치·전복</option>
      <option value="해장국">해장국</option><option value="횟집">횟집</option><option value="고깃집">고깃집</option><option value="술집">술집</option>

    <select id="radius">
      <option value="100">100m</option><option value="200">200m</option><option value="300">300m</option><option value="500">500m</option><option value="1000" selected>1km</option><option value="2000">2km</option>

  <div id="mapFloatTools"><button id="roadMapBtn" class="active">일반</button><button id="hybridMapBtn">위성</button></div>

  <div id="detailHead"><div><h3 id="detailName"></h3><div id="detailMeta"></div></div><button id="closeDetail">닫기</button></div>

  <div id="qOpt" class="notFuel"><span>웹·블로그 검색어:</span><button id="qNameBtn">상호만</button><button id="qDongBtn">상호+동네</button></div>
  <div id="sourceInfo"></div>
  <div id="mapTools"><button id="satBtn">🛰 위성지도</button><button id="roadBtn">🛣 카카오 로드뷰</button><button id="deleteBtn">✕ 이번 검색에서 제외</button></div>
  <div id="extTools"><button id="kakaoRoadBtn">↗ 카카오 로드뷰 앱</button><button id="extRoadBtn">↗ Google 스트리트뷰</button></div>

    <div id="webQueries"></div>
    <div style="margin-top:9px;font-size:10px;color:#737a84">내 확인 기록 (이 폰에만 저장)</div>

<script>
const $=id=>document.getElementById(id);
const API='/.netlify/functions/kplace';
let map, ps, searchCenter, centerMarker, radiusCircle;
let overlays=[], angles={}, searchToken=0, currentPlace=null, hybridOn=false, roadview=null, roadClient=null;
let rawItems=[], lastItems=[], excluded=new Set(), excludedHistory=[], filterStats={fran:0,minus:0};
const ENRICH={};            // place id -> 카카오 상세 요약 (평점·리뷰·블로그·방문자·유가·충전기)
let enrichState='idle';     // idle | loading | ok | fail
let foodRadius='1000';

/* ---------- 저장(이 폰에만) ---------- */
function lsGet(k,d){try{const v=localStorage.getItem('pinb_'+k);return v===null?d:JSON.parse(v)}catch(_){return d}}
function lsSet(k,v){try{localStorage.setItem('pinb_'+k,JSON.stringify(v))}catch(_){}}

/* ---------- 테마 ---------- */
const THEMES={
  FD6:{cat:'FD6'}, CE7:{cat:'CE7'},
  흑돼지:{kw:['흑돼지'],cg:'FD6'}, 고기국수:{kw:['고기국수'],cg:'FD6'}, 해물:{kw:['갈치','전복','해물'],cg:'FD6'},
  해장국:{kw:['해장국'],cg:'FD6'}, 횟집:{kw:['횟집'],cg:'FD6'}, 고깃집:{kw:['고깃집'],cg:'FD6'}, 술집:{kw:['술집'],cg:''},
  한식:{kw:['한식'],cg:'FD6'}, 일식:{kw:['일식'],cg:'FD6'}, 중식:{kw:['중식'],cg:'FD6'},
  브런치:{kw:['브런치'],cg:''}, 베이커리:{kw:['베이커리'],cg:''}
};
// 관광지 테마: 카카오 분류(관광명소 AT4 / 문화시설 CT1)로 찾고, 분류명으로 세부 종류를 거름
const TOUR={
  AT4:{q:[{cat:'AT4'}]},
  오름:{q:[{cat:'AT4'},{kw:'오름',cg:'AT4'}],f:/오름/},
  해변:{q:[{cat:'AT4'},{kw:'해수욕장',cg:'AT4'}],f:/해수욕장|해변|해안/},
  폭포:{q:[{cat:'AT4'},{kw:'폭포',cg:'AT4'}],f:/폭포/},
  숲:{q:[{cat:'AT4'},{kw:'숲길',cg:'AT4'}],f:/숲|공원|수목원|휴양림|도보여행|올레/},
  박물관:{q:[{cat:'CT1'}],f:/박물관|미술관|전시|기념관/},
  체험:{q:[{cat:'AT4'},{kw:'테마파크'}],f:/테마파크|체험|동물원|아쿠아|놀이|농장/}
};
const JEJU={s:33.10,n:33.58,w:126.14,e:126.98};   // 제주 전체(우도·마라도 포함) 사각형
const RANKS={
  tour:[['recommend','⭐ 추천(인기)'],['near','가까운순'],['rating','★ 평점순'],['hot','🔥 지금 붐비는'],['blog','📝 블로그 많은']],
  food:[['recommend','⭐ 추천(평판)'],['rating','★ 평점순'],['near','가까운순'],['hot','🔥 지금 붐비는'],['local','🏠 현지인풍'],['blog','📝 블로그 많은']],
  gas:[['cheap','💰 최저가순'],['near','가까운순']],
  ev:[['near','가까운순'],['avail','🔌 빈 충전기 많은']]
};
function fuelKind(){return $('fuel').value}
function appMode(){return $('mode').value}
function rankSet(){const m=appMode();return m==='fuel'?(fuelKind()==='ev'?'ev':'gas'):m}
function radiusVal(){const v=$('radius').value;return v==='jeju'?Infinity:+v}
function fillRank(reset){
  const set=rankSet(), prev=reset?'':$('rank').value;
  $('rank').innerHTML=RANKS[set].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(RANKS[set].some(([v])=>v===prev)) $('rank').value=prev;
}

/* ---------- 키워드 +/- ---------- */
function parseKw(){
  const plus=[], minus=[];
  ($('kw').value||'').split(/[\s,]+/).forEach(chunk=>{
    chunk.split(/(?=[+\-])/).forEach(t=>{
      if(!t)return;
      if(t[0]==='-'){const w=t.slice(1).trim(); if(w)minus.push(w)}
      else {const w=t.replace(/^\++/,'').trim(); if(w)plus.push(w)}
    });
  });
  return {plus:[...new Set(plus)],minus:[...new Set(minus)]};
}

/* ---------- 프랜차이즈 판정 ----------
   카카오 분류는 체인점일 때 맨 끝 단계에 브랜드명이 붙습니다 (예: 음식점 > 카페 > 커피전문점 > 스타벅스).
   그 브랜드명이 상호에 들어 있으면 프랜차이즈로 봅니다. 일반 분류명(국수·해장국 등)은 제외. */
const GENERIC_CATS=new Set(('한식,중식,일식,양식,분식,카페,커피전문점,디저트카페,테마카페,북카페,애견카페,전통찻집,베이커리,간식,'+
 '국수,칼국수,냉면,막국수,해장국,곰탕,설렁탕,국밥,순대,감자탕,찌개,찌개,전골,두부전문점,한정식,쌈밥,죽,도시락,김밥,떡볶이,라면,'+
 '삼겹살,갈비,육류,고기,소고기,돼지고기,정육식당,오리,닭요리,찜닭,닭강정,치킨,곱창,막창,족발,보쌈,'+
 '회,횟집,해물,생선,해산물,조개,장어,복어,아구,게,대게,전복,갈치,고등어,매운탕,해물탕,초밥,롤,돈까스,우동,라멘,이자카야,'+
 '피자,햄버거,수제버거,패스트푸드,스테이크,파스타,이탈리안,프랑스음식,멕시칸,브런치,샐러드,샌드위치,토스트,'+
 '중국요리,양꼬치,마라탕,딤섬,베트남음식,태국음식,인도음식,아시아음식,퓨전요리,뷔페,고기뷔페,샤브샤브,'+
 '술집,호프,요리주점,포장마차,와인바,칵테일바,오뎅바,실내포장마차,아이스크림,빙수,떡,떡카페,도넛,제과').split(','));
function isFranchise(p){
  const parts=(p.category_name||'').split('>').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return false;
  const leaf=parts[parts.length-1];
  if(GENERIC_CATS.has(leaf)||leaf.includes(',')) return false;
  const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  const l=norm(leaf);
  return l.length>=2 && norm(p.place_name).includes(l);
}

/* ---------- 지도 기본 ---------- */
function setStatus(t){$('status').textContent=t}
function clearPlaces(){overlays.forEach(o=>o.setMap(null));overlays=[]}
function updateRestoreButtons(){
  $('undoExcludeBtn').disabled=!excludedHistory.length;
  $('restoreAllBtn').disabled=!excluded.size;
}
function clearExclusions(){excluded.clear();excludedHistory=[];updateRestoreButtons()}
function excludePlace(id){if(!excluded.has(id)){excluded.add(id);excludedHistory.push(id)}updateRestoreButtons()}
function undoExclude(){
  while(excludedHistory.length){const id=excludedHistory.pop();if(excluded.delete(id))break}
  updateRestoreButtons();renderFromLast({fit:false});
}
function restoreAll(){excluded.clear();excludedHistory=[];updateRestoreButtons();renderFromLast({fit:false})}
function setMapMode(mode){
  if(!map)return;
  hybridOn=(mode==='hybrid');
  map.setMapTypeId(hybridOn?kakao.maps.MapTypeId.HYBRID:kakao.maps.MapTypeId.ROADMAP);
  $('roadMapBtn').classList.toggle('active',!hybridOn);
  $('hybridMapBtn').classList.toggle('active',hybridOn);
  $('satBtn').textContent=hybridOn?'🗺 일반지도':'🛰 위성지도';
}
function updateRadiusCircle(){
  if(!map||!searchCenter)return;
  const r=radiusVal();
  if(!isFinite(r)){if(radiusCircle)radiusCircle.setMap(null);return}
  if(!radiusCircle){
    radiusCircle=new kakao.maps.Circle({center:searchCenter,radius:r,strokeWeight:2,strokeColor:'#1677ff',strokeOpacity:.78,strokeStyle:'solid',fillColor:'#1677ff',fillOpacity:.10,zIndex:1});
    radiusCircle.setMap(map);
  }else{radiusCircle.setPosition(searchCenter);radiusCircle.setRadius(r);if(!radiusCircle.getMap())radiusCircle.setMap(map)}
}
function moveCenter(lat,lng){
  searchCenter=new kakao.maps.LatLng(lat,lng);
  centerMarker.setPosition(searchCenter);map.setCenter(searchCenter);updateRadiusCircle();clearExclusions();searchPlaces(true);
}
function init(lat,lng){
  searchCenter=new kakao.maps.LatLng(lat,lng);
  map=new kakao.maps.Map($('map'),{center:searchCenter,level:5});
  ps=new kakao.maps.services.Places();
  centerMarker=new kakao.maps.Marker({map,position:searchCenter});
  updateRadiusCircle();
  kakao.maps.event.addListener(map,'dragend',()=>{
    $('again').classList.add('pulse');
    setStatus('지도를 옮겼습니다. 가운데 + 위치로 찾으려면 “이 지역 검색”을 누르세요.');
  });
  searchPlaces(true);
}
function distanceM(lat1,lng1,lat2,lng2){
  const R=6371000,p=Math.PI/180;
  const a=Math.sin((lat2-lat1)*p/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin((lng2-lng1)*p/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(m){m=Math.round(m);return m<1000?m+'m':(m/1000).toFixed(1)+'km'}
function fmtRadius(r){return !isFinite(r)?'제주 전체':r>=1000?(r/1000)+'km':r+'m'}
function won(n){return (+n).toLocaleString('ko-KR')+'원'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- 검색 ---------- */
function buildQueries(){
  if(appMode()==='fuel'){
    const f=fuelKind();
    if(f==='ev') return [{kw:'전기차충전소'}];
    if(f==='lpg') return [{cat:'OL7'},{kw:'LPG충전소'}];
    return [{cat:'OL7'}];
  }
  const {plus}=parseKw();
  if(appMode()==='tour'){
    if(plus.length) return plus.map(k=>({kw:k}));
    return (TOUR[$('tourTheme').value]||TOUR.AT4).q;
  }
  const t=THEMES[$('theme').value]||THEMES.FD6;
  if(plus.length){
    const cg=$('theme').value==='CE7'?'CE7':'FD6';
    return plus.map(k=>({kw:k,cg}));
  }
  if(t.cat) return [{cat:t.cat}];
  return t.kw.map(k=>({kw:k,cg:t.cg}));
}
function sampleLayout(radius){
  if(radius<=150) return {pts:[[0,0]],sr:radius,pages:3};
  if(radius<=500) return {pts:[[0,0],[.52,0],[-.52,0],[0,.52],[0,-.52]],sr:Math.ceil(radius*.62),pages:2};
  if(radius<5000) return {pts:[[0,0],[.54,0],[-.54,0],[0,.54],[0,-.54],[.38,.38],[-.38,.38],[.38,-.38],[-.38,-.38]],sr:Math.ceil(radius*.62),pages:radius<=1000?2:3};
  // 5km 이상: 가운데 + 안쪽 4곳 + 바깥 8곳을 나눠 검색 (카카오는 한 지점당 최대 45곳)
  const pts=[[0,0]];
  for(let i=0;i<4;i++){const a=(45+90*i)*Math.PI/180;pts.push([.4*Math.cos(a),.4*Math.sin(a)])}
  for(let i=0;i<8;i++){const a=(45*i)*Math.PI/180;pts.push([.75*Math.cos(a),.75*Math.sin(a)])}
  return {pts,sr:Math.min(20000,Math.ceil(radius*.42)),pages:3};
}
function searchPlaces(keepCenter){
  if(!map||!ps)return;
  const token=++searchToken;
  $('again').classList.remove('pulse');
  if(enrichState==='fail')enrichState='idle';   // 서버 연결은 검색할 때마다 한 번씩 다시 시도
  clearPlaces();
  if(!keepCenter) searchCenter=map.getCenter();
  centerMarker.setPosition(searchCenter);
  updateRadiusCircle();
  const radius=radiusVal();
  const queries=buildQueries();
  const whole=!isFinite(radius);
  const lay=whole?{pages:3}:sampleLayout(radius);
  const pages=queries.length>1?Math.min(2,lay.pages):lay.pages;
  setStatus(whole?'제주 전체에서 후보 모으는 중…':'반경 안 후보 모으는 중…');
  const tileOrd={};
  const collected=new Map();
  let pending=0, finished=false;
  const lat0=searchCenter.getLat(), lng0=searchCenter.getLng();
  const offsetLatLng=(xf,yf)=>new kakao.maps.LatLng(lat0+yf*radius/111320, lng0+xf*radius/(111320*Math.cos(lat0*Math.PI/180)));
  const SB=kakao.maps.services.SortBy;
  function done(){
    pending--;
    if(pending===0&&!finished){finished=true;onCollected([...collected.values()],token)}
  }
  function oneSearch(area,q){
    pending++;
    // 반경 검색은 거리순, 제주 전체는 칸(타일)별 정확도순(=카카오가 대표로 치는 곳 먼저)
    const opts=area.bounds?{bounds:area.bounds,sort:SB.ACCURACY||'accuracy',size:15}:{location:area.loc,radius:lay.sr,sort:SB.DISTANCE,size:15};
    const tile=area.tile;
    if(q.cg) opts.category_group_code=q.cg;
    const cb=(data,status,pagination)=>{
      if(token!==searchToken)return;
      if(status===kakao.maps.services.Status.OK){
        data.forEach(p=>{
          const d=distanceM(lat0,lng0,+p.y,+p.x);
          if(d<=radius&&!collected.has(p.id)){
            const o={...p,_dist:d};
            if(tile!=null){o._tile=tile;o._ord=tileOrd[tile]=(tileOrd[tile]||0)+1}
            collected.set(p.id,o);
          }
        });
        if(pagination&&pagination.hasNextPage&&pagination.current<pages){pagination.nextPage();return}
      }
      done();
    };
    if(q.cat) ps.categorySearch(q.cat,cb,opts); else ps.keywordSearch(q.kw,cb,opts);
  }
  if(whole){
    const cols=5,rows=3,dy=(JEJU.n-JEJU.s)/rows,dx=(JEJU.e-JEJU.w)/cols;
    for(let rI=0;rI<rows;rI++)for(let c=0;c<cols;c++){
      const b=new kakao.maps.LatLngBounds(new kakao.maps.LatLng(JEJU.s+dy*rI,JEJU.w+dx*c),new kakao.maps.LatLng(JEJU.s+dy*(rI+1),JEJU.w+dx*(c+1)));
      queries.forEach(q=>oneSearch({bounds:b,tile:rI*cols+c},q));
    }
  }else queries.forEach(q=>lay.pts.forEach(([x,y])=>oneSearch({loc:offsetLatLng(x,y)},q)));
}
function filterItems(items){
  filterStats={fran:0,minus:0};
  if(appMode()==='fuel'){
    const f=fuelKind();
    const txt=p=>(p.category_name||'')+' '+(p.place_name||'');
    if(f==='gas') return items.filter(p=>/주유소/.test(p.category_name||''));
    if(f==='lpg') return items.filter(p=>/LPG|가스충전/i.test(txt(p)));
    return items.filter(p=>/전기차/.test(txt(p))&&!/LPG|가스충전/i.test(txt(p)));
  }
  const {plus,minus}=parseKw();
  const noFran=appMode()==='food'&&$('noFran').checked;
  const tf=appMode()==='tour'&&!plus.length?(TOUR[$('tourTheme').value]||{}).f:null;
  return items.filter(p=>{
    if(tf&&!tf.test(p.category_name||''))return false;
    const txt=(p.place_name||'')+' '+(p.category_name||'');
    if(minus.some(m=>txt.includes(m))){filterStats.minus++;return false}
    if(noFran&&isFranchise(p)){filterStats.fran++;return false}
    return true;
  });
}
function onCollected(items,token){
  rawItems=items;
  lastItems=filterItems(rawItems);
  renderFromLast();
  enrichThenRender(token);
}
function refilter(){
  lastItems=filterItems(rawItems);
  renderFromLast({fit:false});
  enrichThenRender(searchToken);
}

/* ---------- 평판·가격 데이터 (Netlify 함수) ---------- */
function enrichTargets(){
  const pool=lastItems.filter(p=>!excluded.has(p.id));
  if(appMode()==='fuel') return [...pool].sort((a,b)=>a._dist-b._dist).slice(0,70);
  const radius=radiusVal();
  if(!isFinite(radius)){   // 제주 전체: 칸마다 대표 10곳씩
    return pool.filter(p=>p._ord==null||p._ord<=10).slice(0,160);
  }
  return pool.length>48?chooseSpread(pool,radius,48):pool;
}
async function enrichThenRender(token){
  const need=enrichTargets().map(p=>p.id).filter(id=>!(id in ENRICH));
  if(!need.length){ renderFromLast({fit:false}); return; }
  enrichState='loading';
  setStatus($('status').textContent+' · 평판/가격 불러오는 중…');
  const batches=[];for(let i=0;i<need.length;i+=20)batches.push(need.slice(i,i+20));
  let got=0, answered=false;
  for(let i=0;i<batches.length;i+=3){
    const res=await Promise.all(batches.slice(i,i+3).map(b=>
      fetch(API+'?ids='+b.join(','),{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)));
    res.forEach((j,k)=>{
      if(!j||typeof j!=='object')return;
      answered=true;
      batches[i+k].forEach(id=>{const v=j[id]; if(v&&!v.err){ENRICH[id]=v;got++}});   // 실패한 곳은 다음 검색 때 다시 시도
    });
    if(token!==searchToken)return;
  }
  enrichState=(answered&&(got>0||Object.keys(ENRICH).length>0))?'ok':'fail';
  if(token!==searchToken)return;
  renderFromLast({fit:false});
}

/* ---------- 점수 ---------- */
function bayes(e){ if(!e||!e.n) return null; return (e.r*e.n+3.6*12)/(e.n+12); }   // 리뷰 적은 집의 평점 거품 제거
function scoreParts(e){
  if(!e||!Object.keys(e).length) return null;
  const b=bayes(e);
  const q=b==null?.25:clamp((b-3)/1.6,0,1);
  const vol=clamp(Math.log10(1+(e.n||0))/2.7,0,1);
  const buzz=clamp(Math.log10(1+(e.b||0))/3.3,0,1);
  return {q:Math.round(45*q),vol:Math.round(25*vol),buzz:Math.round(15*buzz),badge:e.badge?8:0,award:e.award&&e.award.length?7:0};
}
function qScore(e){const s=scoreParts(e);return s?s.q+s.vol+s.buzz+s.badge+s.award:null}
function hourKST(){return +new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date())%24}
function uvNow(e){const v=e&&e.uv&&e.uv[hourKST()];return v>0?v:0}
function localScore(e){
  if(!e||!(e.n>=5))return -1;
  const q=clamp((bayes(e)-3)/1.6,0,1), ratio=e.n/(e.n+(e.b||0)), vol=clamp(Math.log10(1+e.n)/2.5,0,1);
  return 45*q+35*ratio+20*vol;
}
function fuelPrice(e){
  if(!e||!e.gas)return null;
  const v=fuelKind()==='lpg'?e.gas.l:e.gas.g;
  return v>0?v:null;
}
function fuelAvg(e){if(!e||!e.gas)return null;const v=fuelKind()==='lpg'?e.gas.al:e.gas.ag;return v>0?Math.round(v):null}

/* ---------- 고르기 ---------- */
function chooseSpread(items,radius,n){
  if(items.length<=n)return [...items].sort((a,b)=>a._dist-b._dist);
  const pool=[...items].sort((a,b)=>a._dist-b._dist), picked=[], used=new Set();
  for(let i=0;i<n;i++){
    const target=radius*((i+.5)/n);let best=null,bs=Infinity;
    for(const p of pool){if(used.has(p.id))continue;const s=Math.abs(p._dist-target);if(s<bs){best=p;bs=s}}
    if(best){picked.push(best);used.add(best.id)}
  }
  return picked.sort((a,b)=>a._dist-b._dist);
}
function hasData(p){const e=ENRICH[p.id];return e&&Object.keys(e).length>0}
function selectTop(items,radius,wanted,mode){
  const ok=enrichState==='ok';
  const byDist=(a,b)=>a._dist-b._dist;
  const sortBy=(fn)=>{
    const withD=items.filter(hasData), noD=items.filter(p=>!hasData(p)).sort(byDist);
    return [...withD.sort((a,b)=>fn(b)-fn(a)||a._dist-b._dist),...noD].slice(0,wanted);
  };
  if(mode==='near') return [...items].sort(byDist).slice(0,wanted);
  if(!ok){
    if(mode==='cheap'||mode==='avail') return [...items].sort(byDist).slice(0,wanted);
    if(!isFinite(radius)) return [...items].sort((a,b)=>(a._ord||99)-(b._ord||99)||a._dist-b._dist).slice(0,wanted);
    return chooseSpread(items,radius,wanted);
  }
  switch(mode){
    case 'recommend': return sortBy(p=>(qScore(ENRICH[p.id])??0)-(isFinite(radius)?12*(p._dist/radius):0));
    case 'rating': return sortBy(p=>{const b=bayes(ENRICH[p.id]);return b==null?0:b});
    case 'hot': return sortBy(p=>uvNow(ENRICH[p.id])*1000+(qScore(ENRICH[p.id])||0));
    case 'local': return sortBy(p=>localScore(ENRICH[p.id]));
    case 'blog': return sortBy(p=>ENRICH[p.id].b||0);
    case 'cheap': {
      const priced=items.filter(p=>fuelPrice(ENRICH[p.id])), rest=items.filter(p=>!fuelPrice(ENRICH[p.id])).sort(byDist);
      return [...priced.sort((a,b)=>fuelPrice(ENRICH[a.id])-fuelPrice(ENRICH[b.id])||a._dist-b._dist),...rest].slice(0,wanted);
    }
    case 'avail': {
      const fast=$('fastOnly').checked;
      return sortBy(p=>{const v=ENRICH[p.id].ev;return v?(fast?v.fastAv:v.av)*100-(p._dist/1000):-1});
    }
  }
  return isFinite(radius)?chooseSpread(items,radius,wanted):items.slice(0,wanted);
}
function renderFromLast(opt={}){
  const fit=opt.fit!==false;
  const radius=radiusVal(), wanted=+$('cnt').value, mode=$('rank').value;
  clearPlaces();
  let items=lastItems.filter(p=>!excluded.has(p.id));
  const ok=enrichState==='ok';
  let note='';
  if(appMode()!=='fuel'&&$('openOnly').checked){
    // 관광지는 운영시간이 없는 곳(해변·오름 등 상시 개방)은 남김
    if(ok) items=items.filter(p=>{const e=ENRICH[p.id];if(appMode()==='tour'&&(!e||!e.open||!e.open.c))return true;return e&&e.open&&e.open.c==='OPEN'});
    else note=' · 영업중 필터는 평판 데이터 연결 후 적용';
  }
  if(appMode()==='fuel'&&fuelKind()==='ev'&&$('fastOnly').checked){
    if(ok) items=items.filter(p=>{const e=ENRICH[p.id];return e&&e.ev&&e.ev.fast>0});
    else note=' · 급속 필터는 충전기 데이터 연결 후 적용';
  }
  if(!items.length){setStatus('조건에 맞는 곳이 반경 안에 없습니다. 반경을 넓히거나 필터를 풀어보세요.'+note);updateRestoreButtons();return}
  const selected=selectTop(items,radius,wanted,mode);
  if(appMode()==='fuel'){
    const top=new Set(selected.map(p=>p.id));
    const cheapest=minPriceId(items);
    items.filter(p=>!top.has(p.id)).forEach(p=>addDot(p,p.id===cheapest));
  }
  selected.forEach((p,i)=>addPlace(p,i));
  if(fit)fitResults(selected,radius);
  const label=appMode()==='fuel'?$('fuel').selectedOptions[0].text:themeLabel();
  const rankLabel=$('rank').selectedOptions[0]?$('rank').selectedOptions[0].text:'';
  let extra='';
  if(appMode()!=='fuel'){
    if(filterStats.fran)extra+=` · 프랜차이즈 ${filterStats.fran}곳 뺌`;
    if(filterStats.minus)extra+=` · 제외어 ${filterStats.minus}곳 뺌`;
  }
  const dn=appMode()==='fuel'?(fuelKind()==='ev'?'충전기':'가격'):'평판';
  const es={ok:dn+' 데이터 연결됨',fail:dn+' 서버 미연결 → 거리 기준',loading:dn+' 불러오는 중…',idle:''}[enrichState];
  setStatus(`${label} · ${rankLabel} · ${isFinite(radius)?'반경 ':''}${fmtRadius(radius)} · 후보 ${items.length}곳${extra} · ${selected.length}곳 표시${es?' · '+es:''}${note}`);
  updateRestoreButtons();
}
function minPriceId(items){
  let best=null,bp=Infinity;
  items.forEach(p=>{const v=fuelPrice(ENRICH[p.id]);if(v&&v<bp){bp=v;best=p.id}});
  return best;
}
function themeLabel(){
  const {plus,minus}=parseKw();
  let s=plus.length?plus.join('·'):$(appMode()==='tour'?'tourTheme':'theme').selectedOptions[0].text;
  if(minus.length)s+=' (−'+minus.join(',−')+')';
  return s;
}
function fitResults(items,radius){
  if(!isFinite(radius)){
    const b=new kakao.maps.LatLngBounds();
    items.forEach(p=>b.extend(new kakao.maps.LatLng(+p.y,+p.x)));
    if(items.length)map.setBounds(b,70,40,70,40);
    return;
  }
  const lat=searchCenter.getLat(),lng=searchCenter.getLng();
  const dLat=radius/111320, dLng=radius/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));
  const bounds=new kakao.maps.LatLngBounds();
  bounds.extend(new kakao.maps.LatLng(lat-dLat,lng-dLng));
  bounds.extend(new kakao.maps.LatLng(lat+dLat,lng+dLng));
  items.forEach(p=>bounds.extend(new kakao.maps.LatLng(+p.y,+p.x)));
  map.setBounds(bounds,55,55,55,55);
}

/* ---------- 카드 내용 ---------- */
function cardLines(p){
  const e=ENRICH[p.id]||{};
  const cat=(p.category_name||'').split(' > ').pop();
  const dist=fmtDist(p._dist);
  if(appMode()==='fuel'){
    if(fuelKind()==='ev'){
      const v=e.ev;
      if(!v) return [`${dist} · ${escapeHtml(cat)}`,''];
      const speed=v.fast?`급속 ${v.fastAv}/${v.fast}`:`완속 ${v.slowAv}/${v.slow}`;
      return [`<span class="sc">${speed} 가능 · ${v.kw||'?'}kW</span>`,`${dist} · ${escapeHtml(v.op||cat)}`];
    }
    const pr=fuelPrice(e), avg=fuelAvg(e);
    if(!pr) return [`${dist} · ${escapeHtml(cat)}`,'가격 정보 없음'];
    const diff=avg?pr-avg:null;
    return [`<span class="sc">${won(pr)}</span>${diff!=null?` <span class="tag${diff>0?' off':''}">평균${diff>0?'+':''}${diff}</span>`:''}`,`${dist} · ${escapeHtml(cat)}`];
  }
  const l1=`${dist} · ${escapeHtml(cat)}`;
  if(!Object.keys(e).length) return [l1,''];
  const parts=[];
  if(e.n) parts.push(`★${(+e.r).toFixed(1)}(${e.n})`);
  if(e.b) parts.push(`블로그 ${e.b>=1000?(e.b/1000).toFixed(1)+'k':e.b}`);
  const sc=qScore(e); if(sc!=null) parts.push(sc+'점');
  let tag='';
  if(e.open&&e.open.c) tag=e.open.c==='OPEN'?'<span class="tag">영업중</span>':`<span class="tag off">${escapeHtml(e.open.t||'마감')}</span>`;
  return [l1,`<span class="sc">${parts.join(' · ')||'리뷰 없음'}</span>${tag}`];
}
function addDot(p,cheapest){
  const el=document.createElement('div');
  const e=ENRICH[p.id]||{};
  let txt='';
  if(fuelKind()==='ev'){ if(e.ev) txt=e.ev.fast?`⚡${e.ev.fastAv}/${e.ev.fast}`:''; }
  else { const pr=fuelPrice(e); if(pr) txt=pr.toLocaleString('ko-KR'); }
  el.className='dot'+(txt?' lbl':'')+(cheapest?' cheap':'');
  el.textContent=txt;
  el.title=p.place_name;
  ['mousedown','touchstart','pointerdown'].forEach(ev=>el.addEventListener(ev,x=>x.stopPropagation(),{passive:true}));
  el.addEventListener('click',x=>{x.stopPropagation();openDetail(p)});
  const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(+p.y,+p.x),content:el,xAnchor:0.5,yAnchor:0.5,zIndex:3});
  ov.setMap(map);overlays.push(ov);
}
function addPlace(p,i){
  const el=document.createElement('div');el.className='wrap';
  const [l1,l2]=cardLines(p);
  el.innerHTML=`<div class="pin">${i+1}</div><div class="arm"></div><div class="card"><b>${escapeHtml(p.place_name)}</b><small>${l1}</small>${l2?`<small>${l2}</small>`:''}</div>`;
  const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(+p.y,+p.x),content:el,xAnchor:0.5,yAnchor:0.5,zIndex:10});
  ov.setMap(map);overlays.push(ov);
  const pin=el.querySelector('.pin'),card=el.querySelector('.card'),arm=el.querySelector('.arm');
  let a=angles[p.id]??((i*73-30)%360);
  function place(v){
    a=v;angles[p.id]=v;
    const rad=v*Math.PI/180,R=78,x=Math.cos(rad)*R,y=Math.sin(rad)*R;
    arm.style.width=R+'px';arm.style.transform=`rotate(${v}deg)`;
    card.style.left=(x+(x<0?-164:6))+'px';card.style.top=(y-36)+'px';
  }
  place(a);
  let dragging=false,pointerId=null,moved=false,downX=0,downY=0;
  const TAP_SLOP=9;
  function blockMap(e){e.preventDefault();e.stopPropagation()}
  function restoreMapGesture(){
    dragging=false;card.classList.remove('dragging');map.setDraggable(true);map.setZoomable(true);
    try{if(pointerId!==null&&card.hasPointerCapture(pointerId))card.releasePointerCapture(pointerId)}catch(_){}
    pointerId=null;
  }
  card.addEventListener('pointerdown',e=>{
    blockMap(e);dragging=true;moved=false;pointerId=e.pointerId;downX=e.clientX;downY=e.clientY;
    try{card.setPointerCapture(pointerId)}catch(_){}
    map.setDraggable(false);map.setZoomable(false);
  },{passive:false});
  card.addEventListener('pointermove',e=>{
    if(!dragging)return;blockMap(e);
    if(!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)>=TAP_SLOP){moved=true;card.classList.add('dragging')}
    if(!moved)return;
    const r=pin.getBoundingClientRect();
    place(Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI);
  },{passive:false});
  card.addEventListener('pointerup',e=>{
    if(!dragging)return;blockMap(e);
    const wasTap=!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)<TAP_SLOP;
    restoreMapGesture();
    if(wasTap)setTimeout(()=>openDetail(p),140);   // 같은 손가락이 상세 버튼을 누르지 않도록 잠깐 대기
  },{passive:false});
  card.addEventListener('pointercancel',e=>{if(dragging){blockMap(e);restoreMapGesture()}},{passive:false});
  card.addEventListener('lostpointercapture',()=>{if(dragging)restoreMapGesture()});
  ['mousedown','mousemove','mouseup','touchstart','touchmove','touchend','click'].forEach(ev=>card.addEventListener(ev,e=>e.stopPropagation(),{passive:false}));
  pin.addEventListener('click',e=>{e.stopPropagation();place(a+90)});
}

function dongOf(p){

  const fine=toks.filter(t=>/(동|리|가)$/.test(t)&&t.length>=2);

  const mid=toks.filter(t=>/(읍|면)$/.test(t));

}

function repHtml(p){
  const e=ENRICH[p.id];

    return enrichState==='fail'?'평판/가격 데이터 서버(Netlify 함수)가 연결되지 않아 거리 정보만 있습니다.':(enrichState==='loading'?'불러오는 중…':'');

      return `<b>⚡ ${v.fast?`급속 ${v.fastAv}/${v.fast}대 가능`:''}${v.fast&&v.slow?' · ':''}${v.slow?`완속 ${v.slowAv}/${v.slow}대 가능`:''}</b><br>최대 ${v.kw||'?'}kW · ${escapeHtml(v.op)} · ${escapeHtml(v.pub)}${v.hours?' · '+escapeHtml(v.hours):''}${v.park==='Y'?' · 무료주차':''}`;
    }
    if(e.gas){
      const g=e.gas, f=x=>x>0?won(x):'-';
      return `<b>휘발유 ${f(g.g)} · 경유 ${f(g.d)} · LPG ${f(g.l)}</b><br>주변 평균: 휘발유 ${f(Math.round(g.ag))} · LPG ${f(Math.round(g.al))}${g.t?` · 기준 ${escapeHtml(g.t)}`:''}`;
    }
    return '가격 정보 없음';
  }
  const s=scoreParts(e), b=bayes(e);
  let h=`<b>${qScore(e)}점</b> &nbsp;★${e.n?(+e.r).toFixed(1):'-'} (리뷰 ${e.n||0}) · 블로그 ${e.b||0}`;
  if(e.open&&e.open.t)h+=` · ${escapeHtml(e.open.t)}${e.open.i?' ('+escapeHtml(e.open.i)+')':''}`;
  if(e.badge)h+=`<br>🏅 ${escapeHtml(e.badge)}`;
  if(e.award&&e.award.length)h+=`<br>🏆 ${e.award.map(escapeHtml).join(' / ')}`;
  const uv=uvNow(e); if(uv)h+=`<br>🔥 지금 시간대 평균 방문지수 ${uv}`;
  h+=`<br><span style="color:#777;font-size:11px">점수 = 보정평점 ${s.q}/45 + 리뷰량 ${s.vol}/25 + 블로그 ${s.buzz}/15 + 인기배지 ${s.badge}/8 + 수상 ${s.award}/7${b!=null?` · 보정평점 ${b.toFixed(2)}`:''}</span>`;
  return h;
}

$('fuel').onchange=()=>{lsSet('fuel',fuelKind());applyModeClass();fillRank(true);clearExclusions();searchPlaces(true)};
$('theme').onchange=()=>{clearExclusions();searchPlaces(true)};
$('tourTheme').onchange=()=>{clearExclusions();searchPlaces(true)};
let lastKw='[]';
$('kw').addEventListener('change',()=>{
  const now=JSON.stringify(parseKw().plus);
  if(now!==lastKw){lastKw=now;clearExclusions();searchPlaces(true)}  // + 키워드가 바뀌면 다시 검색
  else refilter();                                                     // - 제외어만 바뀌면 다시 거르기만
});
$('kw').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('noFran').onchange=()=>{lsSet('noFran',$('noFran').checked);refilter()};
$('openOnly').onchange=()=>renderFromLast({fit:false});
$('fastOnly').onchange=()=>renderFromLast({fit:false});
$('radius').onchange=()=>{radiusByMode[appMode()]=$('radius').value;lsSet('radiusByMode',radiusByMode);updateRadiusCircle();clearExclusions();searchPlaces(true)};
$('cnt').onchange=()=>renderFromLast();
$('rank').onchange=()=>renderFromLast();
$('qNameBtn').onclick=()=>{qWithDong=false;lsSet('qdong',false);if(currentPlace)openDetail(currentPlace)};
$('qDongBtn').onclick=()=>{qWithDong=true;lsSet('qdong',true);if(currentPlace)openDetail(currentPlace)};

// 저장해 둔 설정 복원
$('noFran').checked=lsGet('noFran',true);
$('fuel').value=lsGet('fuel','gas');
$('mode').value=['food','tour','fuel'].includes(lsGet('mode','food'))?lsGet('mode','food'):'food';
prevMode=appMode();syncJejuOption();
$('radius').value=radiusByMode[appMode()]||RADIUS_DEF[appMode()];if(!$('radius').value)$('radius').value=RADIUS_DEF[appMode()];
applyModeClass();fillRank();

if(typeof kakao==='undefined'||!kakao.maps){
  setStatus('카카오 지도를 불러오지 못했습니다. 카카오 개발자 사이트에 이 주소(도메인)가 등록돼 있는지 확인하세요.');
}else{
  navigator.geolocation.getCurrentPosition(
    p=>init(p.coords.latitude,p.coords.longitude),
    ()=>{setStatus('위치 권한을 사용할 수 없어 기본 위치에서 시작합니다.');init(33.4996,126.5312)},
    {enableHighAccuracy:true,timeout:10000,maximumAge:15000}
  );
}
</script>
</body></html>
